mock:
  name: Mara Triangle Rhino Report (mocked IO, synthetic fixtures)
  mock_io: true
  # All four fetch tasks are io-tagged; override their canned returns with
  # SYNTHETIC fixtures (dev/fixtures/build_rhino_fixtures.py — real mmnr
  # rhino data is sensitive and never committed) shaped exactly like
  # production: title-mapped nested sighting-details arrays, patrol slug /
  # display columns, Jul 2026 timestamps.
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_patrols_from_combined_params: dev/fixtures/get-patrols-rhino.example-return.parquet
    ecoscope.platform.tasks.io.get_patrol_observations_from_patrols_df_and_combined_params: dev/fixtures/patrol-obs-rhino.example-return.parquet
    ecoscope.platform.tasks.io.get_events: dev/fixtures/get-events-rhino.example-return.parquet
    ecoscope.platform.tasks.io.process_events_details: dev/fixtures/process-events-details-rhino.example-return.parquet
  params:
    workflow_details:
      name: "Mara Triangle Rhino Report (Mock)"
      description: "Rhino monitoring from EarthRanger (mmnr)"
    time_range:
      since: "2026-07-01T00:00:00"
      until: "2026-07-31T23:59:59"
      timezone:
        label: "(GMT+03:00) Nairobi"
        tzCode: "Africa/Nairobi"
        name: "East Africa Time"
        utc: "+03:00"
    er_client_name:
      data_source:
        name: "mmnr"
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1
    rhino_report:
      # SHA-pinned raw URL: the template changed on this branch, so a main-ref
      # URL serves the stale copy until the PR merges. d7ae178 carries the
      # current template (identical to what main will have post-merge).
      template_path: "https://raw.githubusercontent.com/wildlife-dynamics/mt-rhino/d7ae178/resources/templates/mt_rhino_report_template.docx"

mock_empty:
  name: Mara Triangle Rhino Report (mocked IO, empty fixtures — skipif/placeholder path)
  mock_io: true
