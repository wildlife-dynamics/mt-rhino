id: mt_rhino

requirements:
  # DEV ONLY: local editable ecoscope on branch optional-time-interval
  # (worktree checkout), which carries the generalized draw_chart task
  # (optional time_interval -> categorical x axis, per-figure bar/line).
  # Before publish: revert to a released ecoscope-platform pin that ships
  # draw_chart. Run dev/postcompile-editable.sh after every compile
  # (pydantic + platform patches), then test with --frozen.
  # NOTE: "plotting" extra is required — ext-custom's entry point imports
  # plotly via the ecoplot helpers, and without it discovery silently drops
  # every ext-custom task.
  - name: ecoscope
    path: /Users/yunwu/MEP/wt-tasks/ecoscope/.claude/worktrees/optional-time-interval
    editable: true
    extras: ["platform", "mapping", "analysis", "plotting"]
  # DEV MODE: editable local ext-custom (pivot_dataframe,
  # merge_two_dataframes, create_docx). Before publish: restore the
  # versioned channel requirement (>= 0.1.0rc24).
  - name: ecoscope-workflows-ext-custom
    path: /Users/yunwu/MEP/wt-tasks/ecoscope-workflow-task-library/src/ecoscope-workflows-ext-custom
    editable: true
  # editable ext-custom declares setuptools<=81.0.0; pin the conda side to
  # match or the pypi solve conflicts with the conda-pinned setuptools
  - name: setuptools
    version: "<=81.0.0"
    channel: conda-forge
  # Editable-mode conda pins (see ecoscope-spec.md "editable dev-mode
  # pitfalls"): lonboard ==0.0.8 only exists as the conda build on the
  # ecoscope-workflows channel; numpy is pinned strictly by ecoscope;
  # pyarrow <24 per ecoscope-earthranger-io-core; rasterio <1.5 avoids the
  # libgdal/pyogrio conflict and the missing osx-arm64 wheel.
  - name: lonboard
    version: "==0.0.8"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: numpy
    version: ">=2,<2.1"
    channel: conda-forge
  - name: pyarrow
    version: ">=20,<24"
    channel: conda-forge
  - name: rasterio
    version: ">=1.3,<1.5"
    channel: conda-forge
  - name: pydeck
    version: "0.9.2"
    channel: conda-forge

rjsf-overrides:
  properties:
    Process Patrols.properties.patrol_traj.properties.trajectory_segment_filter.default:
      min_length_meters: 0.001
      max_length_meters: 10000
      min_time_secs: 1
      max_time_secs: 172800
      min_speed_kmhr: 0.01
      max_speed_kmhr: 500
    base_map_defs.properties.base_maps.default:
      - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
        opacity: 1
    rhino_report.properties.template_path.default: "https://raw.githubusercontent.com/wildlife-dynamics/mt-rhino/main/resources/templates/mt_rhino_report_template.docx"

  uiSchema:
    Process Patrols.filter_patrol_coords.filter_point_coords.items.ui:options.label: false

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  # ── Setup ──────────────────────────────────────────────
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: '%d %b %Y %H:%M:%S %Z'

  - name: Extract Timezone
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Data Source
    id: er_client_name
    task: set_er_connection

  # ── Fetch Patrols (EarthRanger) ────────────────────────
  - title: Fetch Patrols
    type: task-group
    description: "Fetch rhino monitoring patrols and observations from EarthRanger."
    tasks:
      - name: Set Patrol Parameters
        id: er_patrol_params
        task: set_patrols_and_patrol_events_params
        partial:
          client: ${{ workflow.er_client_name.return }}
          time_range: ${{ workflow.time_range.return }}
          patrol_types:
            - rhino_monitoring_patrol            # Rhino Monitoring - Foot (Triangle)
            - rhino_monitoring_vehicle_patrol    # Rhino Monitoring - Vehicle (Triangle)
            - rhino_monitor_patrol_reserve       # Rhino Monitoring - Foot (Reserve)
            - rhino_monitoring_veh_patrol_reserve  # Rhino Monitoring - Vehicle (Reserve)
          event_types: []
          status: ["done"]
          include_patrol_details: true
          raise_on_empty: false
          include_null_geometry: true
          truncate_to_time_range: true
          sub_page_size: 100
          patrols_overlap_daterange: true

      - name: Get Patrols
        id: prefetch_patrols
        task: get_patrols_from_combined_params
        partial:
          combined_params: ${{ workflow.er_patrol_params.return }}

      - name: Get Patrol Observations
        id: patrol_obs
        task: get_patrol_observations_from_patrols_df_and_combined_params
        partial:
          patrols_df: ${{ workflow.prefetch_patrols.return }}
          combined_params: ${{ workflow.er_patrol_params.return }}

  - name: Convert Patrol Observations to Timezone
    id: convert_patrols_tz
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.patrol_obs.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns: ["fixtime", "patrol_start_time", "patrol_end_time"]

  # ── Process Patrols ────────────────────────────────────
  - title: Process Patrols
    type: task-group
    description: "Process patrol observations into rhino monitoring trajectories."
    tasks:
      - name: Remove Column Prefix (Observations)
        id: drop_prefix_obs
        task: drop_column_prefix
        partial:
          df: ${{ workflow.convert_patrols_tz.return }}
          prefix: "extra__"
          duplicate_strategy: "suffix"

      - name: Rename Patrol Columns
        id: rename_patrol_cols
        task: map_columns
        partial:
          df: ${{ workflow.drop_prefix_obs.return }}
          drop_columns: ["patrol_type"]           # UUID column
          rename_columns:
            patrol_type__value: "patrol_type"     # slug
            patrol_type__display: "patrol_type_display"
          retain_columns: []
          raise_if_not_found: false

      - name: Filter Patrol Coordinates
        id: filter_patrol_coords
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.rename_patrol_cols.return }}
          roi_gdf: null
          roi_name: null
          reset_index: false
          bounding_box:
            min_x: -180.0
            max_x: 180.0
            min_y: -90.0
            max_y: 90.0
          filter_point_coords:
            - {x: 180.0, y: 90.0}
            - {x: 0.0, y: 0.0}
            - {x: 1.0, y: 1.0}

      - name: Convert to Trajectories
        id: patrol_traj
        task: relocations_to_trajectory
        partial:
          relocations: ${{ workflow.filter_patrol_coords.return }}

      - name: Remove Column Prefix (Trajectories)
        id: drop_prefix_traj
        task: drop_column_prefix
        partial:
          df: ${{ workflow.patrol_traj.return }}
          prefix: "extra__"
          duplicate_strategy: "suffix"

      - name: Clean Up Trajectory Columns
        id: cleanup_traj_cols
        task: map_columns
        partial:
          df: ${{ workflow.drop_prefix_traj.return }}
          rename_columns: {}
          drop_columns: ["id", "track"]
          retain_columns: []
          raise_if_not_found: false

      - name: Patrol Trajectory Colormap
        id: patrol_colormap
        task: apply_color_map
        partial:
          df: ${{ workflow.cleanup_traj_cols.return }}
          input_column_name: "patrol_type_display"
          output_column_name: "patrol_colormap"
          colormap: "Dark2"

  # ── Fetch & Process Rhino Sightings (EarthRanger) ──────
  - name: Get Rhino Sighting Events
    id: er_events
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_types: ["black_rhino_sighting_v202310"]
      event_columns: null
      include_null_geometry: false
      raise_on_empty: false
      include_details: true
      include_updates: false
      include_related_events: false
      include_display_values: true
      force_point_geometry: true

  - name: Resolve Event Details
    id: events_details
    task: process_events_details
    partial:
      df: ${{ workflow.er_events.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true
      ordered: true

  - name: Convert Events to Timezone
    id: convert_events_tz
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.events_details.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns: ["time"]

  - title: Process Sightings
    type: task-group
    description: "Flatten rhino sighting details into one record per individual sighting."
    tasks:
      - name: Filter Event Coordinates
        id: filter_event_coords
        task: apply_reloc_coord_filter
        partial:
          df: ${{ workflow.convert_events_tz.return }}
          roi_gdf: null
          roi_name: null
          reset_index: false
          bounding_box:
            min_x: -180.0
            max_x: 180.0
            min_y: -90.0
            max_y: 90.0
          filter_point_coords:
            - {x: 180.0, y: 90.0}
            - {x: 0.0, y: 0.0}
            - {x: 1.0, y: 1.0}

      - name: Flatten Rhino Sightings
        id: rhino_obs_long
        task: apply_sql_query
        partial:
          df: ${{ workflow.filter_event_coords.return }}
          sanitize: true          # event_details dict -> JSON string; json_each explodes it
          columns: null
          query: >-
            SELECT * FROM (
              SELECT df.id AS event_id, df.serial_number, df.time, df.geometry,
                COALESCE(json_extract(j.value, '$."Bull"'), json_extract(j.value, '$."Kifaru ID"')) AS "Rhino Name",
                COALESCE(json_extract(j.value, '$."Sighting"'), 'Unknown') AS "Sighting Method"
              FROM df, json_each(COALESCE(json_extract(df.event_details, '$."Sighting Details - Bulls"'), '[]')) AS j
              UNION ALL
              SELECT df.id AS event_id, df.serial_number, df.time, df.geometry,
                COALESCE(json_extract(j.value, '$."Known Cows"'), json_extract(j.value, '$."Kifaru ID"')) AS "Rhino Name",
                COALESCE(json_extract(j.value, '$."Sighting"'), 'Unknown') AS "Sighting Method"
              FROM df, json_each(COALESCE(json_extract(df.event_details, '$."Sighting Details - Cows"'), '[]')) AS j
              UNION ALL
              SELECT df.id AS event_id, df.serial_number, df.time, df.geometry,
                COALESCE(json_extract(j.value, '$."Unsexed Individual(s)"'), json_extract(j.value, '$."Kifaru ID"')) AS "Rhino Name",
                COALESCE(json_extract(j.value, '$."Sighting"'), 'Unknown') AS "Sighting Method"
              FROM df, json_each(COALESCE(json_extract(df.event_details, '$."Sighting Details - Unsexed Individuals"'), '[]')) AS j
            ) WHERE "Rhino Name" IS NOT NULL

      - name: Rhino Sighting Colormap
        id: rhino_colormap
        task: apply_color_map
        partial:
          df: ${{ workflow.rhino_obs_long.return }}
          input_column_name: "Rhino Name"
          output_column_name: "rhino_colormap"
          colormap: "tab20b"      # ~90 known individuals; 20 colors cycle

  # ── Exports ────────────────────────────────────────────
  - name: Persist Patrol Trajectories
    id: persist_patrol_traj
    task: persist_df_wrapper
    partial:
      df: ${{ workflow.cleanup_traj_cols.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_prefix: "rhino_patrol_trajectories"
      filetypes: ["parquet"]
      sanitize: true
    skipif:
      conditions:
        - never

  - name: Persist Rhino Observations
    id: persist_rhino_obs
    task: persist_df_wrapper
    partial:
      df: ${{ workflow.rhino_obs_long.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_prefix: "rhino_observations"
      filetypes: ["parquet"]
      sanitize: true
    skipif:
      conditions:
        - never

  - name: Base Maps
    id: base_map_defs
    task: set_base_maps

  # ── Mara Triangle Patrol Map ───────────────────────────
  - title: Mara Triangle Patrol Map
    type: task-group
    description: "Trajectory map for Mara Triangle rhino monitoring patrols."
    tasks:
      - name: Set Triangle Map Title
        id: set_tri_map_title
        task: set_string_var
        partial:
          var: "Mara Triangle Rhino Patrols"

      - name: Filter Triangle Trajectories
        id: filter_tri_traj
        task: filter_row_values
        partial:
          df: ${{ workflow.patrol_colormap.return }}
          column: "patrol_type"
          values: ["rhino_monitoring_patrol", "rhino_monitoring_vehicle_patrol"]

      - name: Rename Triangle Display Columns
        id: rename_tri_cols
        task: map_columns
        partial:
          df: ${{ workflow.filter_tri_traj.return }}
          drop_columns: []
          retain_columns: []
          raise_if_not_found: false
          rename_columns:
            segment_start: "Start Time"
            timespan_seconds: "Duration (s)"
            speed_kmhr: "Speed (kph)"

      - name: Create Triangle Polyline Layer
        id: tri_polyline
        task: create_polyline_layer
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          geodataframe: ${{ workflow.rename_tri_cols.return }}
          layer_style:
            get_width: 3
            width_units: "pixels"
            color_column: "patrol_colormap"
          legend:
            label_column: "patrol_type_display"
            color_column: "patrol_colormap"
          tooltip_columns: ["Start Time", "Duration (s)", "Speed (kph)"]

      - name: Draw Triangle Ecomap
        id: tri_ecomap
        task: draw_ecomap
        partial:
          geo_layers: ${{ workflow.tri_polyline.return }}
          tile_layers: ${{ workflow.base_map_defs.return }}
          north_arrow_style:
            placement: "top-left"
          legend_style:
            title: "Patrol Type"
            placement: "bottom-right"
          static: false
          title: null
          max_zoom: 20

      - name: Persist Triangle Ecomap
        id: persist_tri_ecomap
        task: persist_text
        partial:
          text: ${{ workflow.tri_ecomap.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: "triangle_patrol_map"

      - name: Create Triangle Map Widget
        id: tri_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_tri_map_title.return }}
          data: ${{ workflow.persist_tri_ecomap.return }}

      - name: Merge Triangle Map Widget
        id: merged_tri_map
        task: merge_widget_views
        partial:
          widgets:
            - ${{ workflow.tri_map_widget.return }}

  # ── Reserve Patrol Map ─────────────────────────────────
  - title: Reserve Patrol Map
    type: task-group
    description: "Trajectory map for National Reserve rhino monitoring patrols."
    tasks:
      - name: Set Reserve Map Title
        id: set_res_map_title
        task: set_string_var
        partial:
          var: "Reserve Rhino Patrols"

      - name: Filter Reserve Trajectories
        id: filter_res_traj
        task: filter_row_values
        partial:
          df: ${{ workflow.patrol_colormap.return }}
          column: "patrol_type"
          values: ["rhino_monitor_patrol_reserve", "rhino_monitoring_veh_patrol_reserve"]

      - name: Rename Reserve Display Columns
        id: rename_res_cols
        task: map_columns
        partial:
          df: ${{ workflow.filter_res_traj.return }}
          drop_columns: []
          retain_columns: []
          raise_if_not_found: false
          rename_columns:
            segment_start: "Start Time"
            timespan_seconds: "Duration (s)"
            speed_kmhr: "Speed (kph)"

      - name: Create Reserve Polyline Layer
        id: res_polyline
        task: create_polyline_layer
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          geodataframe: ${{ workflow.rename_res_cols.return }}
          layer_style:
            get_width: 3
            width_units: "pixels"
            color_column: "patrol_colormap"
          legend:
            label_column: "patrol_type_display"
            color_column: "patrol_colormap"
          tooltip_columns: ["Start Time", "Duration (s)", "Speed (kph)"]

      - name: Draw Reserve Ecomap
        id: res_ecomap
        task: draw_ecomap
        partial:
          geo_layers: ${{ workflow.res_polyline.return }}
          tile_layers: ${{ workflow.base_map_defs.return }}
          north_arrow_style:
            placement: "top-left"
          legend_style:
            title: "Patrol Type"
            placement: "bottom-right"
          static: false
          title: null
          max_zoom: 20

      - name: Persist Reserve Ecomap
        id: persist_res_ecomap
        task: persist_text
        partial:
          text: ${{ workflow.res_ecomap.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: "reserve_patrol_map"

      - name: Create Reserve Map Widget
        id: res_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_res_map_title.return }}
          data: ${{ workflow.persist_res_ecomap.return }}

      - name: Merge Reserve Map Widget
        id: merged_res_map
        task: merge_widget_views
        partial:
          widgets:
            - ${{ workflow.res_map_widget.return }}

  # ── Rhino Sightings Map ────────────────────────────────
  - title: Rhino Map
    type: task-group
    description: "Point map of individual rhino sightings."
    tasks:
      - name: Set Rhino Map Title
        id: set_rhino_map_title
        task: set_string_var
        partial:
          var: "Rhino Sightings"

      - name: Create Rhino Point Layer
        id: rhino_point_layer
        task: create_point_layer
        skipif:
          conditions:
            - any_is_empty_df
            - any_dependency_skipped
            - all_geometry_are_none
        partial:
          geodataframe: ${{ workflow.rhino_colormap.return }}
          layer_style:
            get_radius: 5.0
            fill_color_column: "rhino_colormap"
          legend:
            label_column: "Rhino Name"
            color_column: "rhino_colormap"
          tooltip_columns: ["Rhino Name", "Sighting Method", "time"]

      - name: Draw Rhino Ecomap
        id: rhino_ecomap
        task: draw_ecomap
        partial:
          geo_layers: ${{ workflow.rhino_point_layer.return }}
          tile_layers: ${{ workflow.base_map_defs.return }}
          north_arrow_style:
            placement: "top-left"
          legend_style:
            title: "Rhino"
            placement: "bottom-right"
          static: false
          title: null
          max_zoom: 13

      - name: Persist Rhino Ecomap
        id: persist_rhino_ecomap
        task: persist_text
        partial:
          text: ${{ workflow.rhino_ecomap.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: "rhino_map"

      - name: Create Rhino Map Widget
        id: rhino_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_rhino_map_title.return }}
          data: ${{ workflow.persist_rhino_ecomap.return }}

      - name: Merge Rhino Map Widget
        id: merged_rhino_map
        task: merge_widget_views
        partial:
          widgets:
            - ${{ workflow.rhino_map_widget.return }}

  # ── Summary Table & Stacked Bar ────────────────────────
  - title: Summary and Chart
    type: task-group
    description: "Per-rhino sighting counts by method: summary table and stacked bar chart."
    tasks:
      - name: Count Sightings by Rhino and Method
        id: method_counts
        task: summarize_df
        partial:
          df: ${{ workflow.rhino_obs_long.return }}
          groupby_cols: ["Rhino Name", "Sighting Method"]
          reset_index: true
          summary_params:
            - display_name: "Count"
              aggregator: count
              column: event_id

      - name: Pivot Methods to Columns
        id: method_pivot
        task: pivot_dataframe
        partial:
          df: ${{ workflow.method_counts.return }}
          index: "Rhino Name"
          columns: "Sighting Method"
          values: "Count"
          fill_value: 0

      - name: Total Sightings per Rhino
        id: rhino_totals
        task: summarize_df
        partial:
          df: ${{ workflow.rhino_obs_long.return }}
          groupby_cols: ["Rhino Name"]
          reset_index: true
          summary_params:
            - display_name: "Total"
              aggregator: count
              column: event_id

      - name: Merge Summary Columns
        id: rhino_summary
        task: merge_two_dataframes
        partial:
          left: ${{ workflow.method_pivot.return }}
          right: ${{ workflow.rhino_totals.return }}
          how: "left"
          on: "Rhino Name"
          fillna_value: 0

      - name: Persist Rhino Summary
        id: persist_summary
        task: persist_df_wrapper
        partial:
          df: ${{ workflow.rhino_summary.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_prefix: "rhino_summary"
          filetypes: ["csv"]
          sanitize: false
        skipif:
          conditions:
            - never

      - name: Set Summary Table Title
        id: set_table_title
        task: set_string_var
        partial:
          var: "Rhino Sighting Summary"

      - name: Draw Summary Table
        id: rhino_table
        task: draw_table
        partial:
          dataframe: ${{ workflow.rhino_summary.return }}
          columns: null
          table_config:
            enable_sorting: true
            enable_filtering: true
            enable_download: true
            hide_header: false

      - name: Persist Summary Table
        id: persist_table
        task: persist_text
        partial:
          text: ${{ workflow.rhino_table.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: "rhino_summary_table"

      - name: Create Summary Table Widget
        id: table_widget
        task: create_table_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_table_title.return }}
          data: ${{ workflow.persist_table.return }}

      - name: Merge Summary Table Widget
        id: merged_table_widget
        task: merge_widget_views
        partial:
          widgets:
            - ${{ workflow.table_widget.return }}

      - name: Set Bar Chart Title
        id: set_bar_title
        task: set_string_var
        partial:
          var: "Rhino Sightings by Method"

      - name: Draw Stacked Bar Chart
        id: rhino_bar
        task: draw_chart      # generalized: no time_interval -> categorical x axis
        partial:
          dataframe: ${{ workflow.rhino_obs_long.return }}
          x_axis: "Rhino Name"
          figures:
            - metric:
                display_name: "Sightings"
                aggregator: count
                column: event_id
              chart_type: "bar"
          category: "Sighting Method"
          barmode: "stack"
          palette: "Dark2"
          layout_style:
            showlegend: true
            legend_title: "Sighting Method"
            yaxis:
              title: "Sightings"

      - name: Persist Bar Chart
        id: persist_bar
        task: persist_text
        partial:
          text: ${{ workflow.rhino_bar.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: "rhino_bar_chart"

      - name: Create Bar Chart Widget
        id: bar_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: ${{ workflow.set_bar_title.return }}
          data: ${{ workflow.persist_bar.return }}

      - name: Merge Bar Chart Widget
        id: merged_bar_widget
        task: merge_widget_views
        partial:
          widgets:
            - ${{ workflow.bar_widget.return }}

  # ── Report & Dashboard ─────────────────────────────────
  - name: Create Rhino Report
    id: rhino_report
    task: create_docx
    skipif:
      conditions:
        - never
    partial:
      context:
        items:
          - item_type: timerange
            key: report_date
            value: ${{ workflow.time_range.return }}
            format: "%b %Y"
          - item_type: image
            key: patrol_map_triangle
            value: ${{ workflow.persist_tri_ecomap.return }}
            screenshot_config:
              wait_for_timeout: 20000
              max_concurrent_pages: 2
              device_scale_factor: 1.0
          - item_type: image
            key: patrol_map_reserve
            value: ${{ workflow.persist_res_ecomap.return }}
            screenshot_config:
              wait_for_timeout: 20000
              max_concurrent_pages: 2
              device_scale_factor: 1.0
          - item_type: image
            key: rhino_map
            value: ${{ workflow.persist_rhino_ecomap.return }}
            screenshot_config:
              wait_for_timeout: 1000
              max_concurrent_pages: 2
              device_scale_factor: 1.0
          - item_type: table
            key: rhino_summary
            value: ${{ workflow.rhino_summary.return }}
          - item_type: image
            key: bar_chart
            value: ${{ workflow.persist_bar.return }}
            screenshot_config:
              wait_for_timeout: 0
              max_concurrent_pages: 2
      groupers: []
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_prefix: mt_rhino_report

  - name: Create Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.merged_tri_map.return }}
        - ${{ workflow.merged_res_map.return }}
        - ${{ workflow.merged_rhino_map.return }}
        - ${{ workflow.merged_table_widget.return }}
        - ${{ workflow.merged_bar_widget.return }}
      groupers: []
      time_range: ${{ workflow.time_range.return }}
